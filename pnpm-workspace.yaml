packages:
  - 'packages/*'

# Shared dependency versions. Packages reference these with "catalog:" so every
# workspace stays on one pinned version. Update here, not in package.json files.
catalog:
  '@eslint/js': ^10.0.1
  '@trivago/prettier-plugin-sort-imports': ^6.0.2
  '@typescript-eslint/eslint-plugin': ^8.63.0
  '@typescript-eslint/parser': ^8.63.0
  eslint: ^10.6.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.7.0
  husky: ^9.1.7
  lint-staged: ^17.0.8
  prettier: ^3.9.4
  tsdown: ^0.22.4
  turbo: ^2.10.4
  # typescript stays on 6.x: typescript-eslint (and the tsc-based typecheck
  # scripts) don't support the native TS 7 compiler yet.
  typescript: ^6.0.3
  vitest: ^4.1.10
  '@types/node': ^26.1.1
  dotenv: ^17.4.2
  fastify: ^5.10.0

# Dependencies allowed to run install-time build scripts.
allowBuilds:
  esbuild: true

# 24h delay for supply-chain safety. This is the only guard on transitive deps:
# Renovate's own 2-day delay doesn't apply when it regenerates the lockfile.
minimumReleaseAge: 1440

# escape hatch for packages that ignore the release age cooldown
minimumReleaseAgeExclude:
  - '@types/node@26.1.1'
  - tsdown@0.22.4
  # Renovate security update: pnpm@11.11.0
  - pnpm@11.11.0
