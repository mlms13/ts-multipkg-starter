packages:
  - 'packages/*'

# Shared dependency versions. Packages reference these with "catalog:" so every
# workspace stays on one pinned version. Update here, not in package.json files.
catalog:
  '@eslint/js': ^10.0.1
  '@trivago/prettier-plugin-sort-imports': ^6.0.2
  '@typescript-eslint/eslint-plugin': ^8.64.0
  '@typescript-eslint/parser': ^8.64.0
  eslint: ^10.7.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.7.0
  husky: ^9.1.7
  lint-staged: ^17.1.0
  prettier: ^3.9.5
  tsdown: ^0.22.12
  turbo: ^2.10.5
  # typescript stays on 6.x: typescript-eslint (and the tsc-based typecheck
  # scripts) don't support the native TS 7 compiler yet.
  typescript: ^6.0.3
  vitest: ^4.1.10
  '@types/node': ^26.1.1
  dotenv: ^17.4.2
  fastify: ^5.10.0

# Dependencies allowed to run install-time build scripts.
allowBuilds:
  esbuild: true

# Escape hatch for pnpm's minimum-release-age supply-chain delay: versions
# listed here may install before they've aged past the threshold. pnpm appends
# entries automatically when an install needs one; prune when bumping past them.
minimumReleaseAgeExclude:
  - '@types/node@26.1.1'
  - tsdown@0.22.4
